spring:
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./dev;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:20}MB
      max-request-size: ${MAX_UPLOAD_MB:20}MB
  h2:
    console:
      enabled: false

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  llm:
    provider: ${LLM_PROVIDER:mock}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}

server:
  port: ${PORT:8080}
  error:
    include-message: always

logging:
  level:
    com.grant.assistant: INFO
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./dev;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

app:
  llm:
    provider: ${LLM_PROVIDER:mock}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}

